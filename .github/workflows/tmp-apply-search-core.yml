name: Temporary bounded search core finalizer

on:
  push:
    branches:
      - feat/bounded-metadata-search

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply and verify bounded metadata search core
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | tar -xz
          cd rust
          cargo fmt --all
          cd ..
          python tools/check_rust_core_policy.py --self-test
          python tools/check_rust_core_policy.py
          cargo test --manifest-path rust/Cargo.toml -p kdbx-fortress-vault-core
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/vault-core/src/metadata.rs rust/vault-core/src/vault_owner.rs rust/vault-core/src/lib.rs
          git commit -m 'feat: add bounded metadata search core'
          git push origin HEAD:feat/bounded-metadata-search
