name: Temporary browse docs finalizer
on:
  push:
    branches: [feat/compose-vault-browser]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/compose-vault-browser
          fetch-depth: 0
      - name: Finalize roadmap and Android documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'missing expected fragment in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          replace('ROADMAP.md',
          "Status: **Phase 1 in progress. Phase 0 is complete. The production Android `:app`, shared `:native-bridge` and CI-only `:smoke-app` modules are established; the Material 3/Compose shell, scoped SAF document access and the first bounded metadata-only Rust/JNI read boundary are implemented. Adapter ABI v4 adds one versioned `nativeReadMetadata` byte-array operation to the five proven lifecycle exports. Vault/group/entry summaries are size-bounded, UUID-addressed and deliberately exclude password values, OTP material, notes/custom secret fields and attachment content. The next Phase-1 tranche is production group/entry browsing over these summaries without duplicating the decrypted database model in Kotlin.**",
          "Status: **Phase 1 in progress. Phase 0 is complete. The production Android `:app`, shared `:native-bridge` and CI-only `:smoke-app` modules are established; the Material 3/Compose shell, scoped SAF document access, the bounded metadata-only Rust/JNI read boundary, and production group/entry browsing are implemented. Adapter ABI v4 still exposes exactly one versioned `nativeReadMetadata` byte-array operation in addition to the five proven lifecycle exports. Production unlock preserves absent versus empty password credentials, supports optional key files, keeps only an opaque Rust handle plus the currently displayed bounded summaries in Kotlin, and fail-closes across background/lifecycle races. The next Phase-1 tranche is Rust-backed search/filtering without widening the metadata channel into secret retrieval.**")

          replace('ROADMAP.md',
          "- The production Android `:app` module and shared `:native-bridge` module build in CI, and the shared bridge now has the bounded metadata-only read API; production open/browse UI wiring, secret retrieval, write path, Autofill implementation and release artifacts remain open.",
          "- The production Android `:app` module and shared `:native-bridge` module build in CI, and production can now select a KDBX document/key file through SAF, unlock through the bounded Rust lifecycle API, and browse real groups/entries through metadata summaries; search/filtering, explicit secret retrieval, write path, Autofill implementation and release artifacts remain open.")

          replace('ROADMAP.md',
          "- [ ] Display groups and entries without duplicating the decrypted database model in Kotlin.\n",
          "- [x] Display groups and entries without duplicating the decrypted database model in Kotlin.\n  - [x] Add bounded production SAF ingestion for unlock (`64 MiB` KDBX, `1 MiB` key file) and preserve the composite-key distinction between absent and deliberately empty password material.\n  - [x] Keep the production browser state to one opaque Rust handle plus the currently displayed bounded vault/group/entry summaries; cap a displayed group at 1,024 direct items until a paged/query API exists.\n  - [x] Keep master-password handling byte-oriented: disable Android view-state persistence/autofill for the editor, consume UTF-8 bytes without creating a Kotlin `String`, and clear transient credential/file buffers after use.\n  - [x] Fail closed across lifecycle races: foreground/background epochs invalidate in-flight unlock/browse work, late handles are locked before publication, and `onStop()` clears transient credential UI then invokes Rust `lock-all`.\n  - [x] Gate the production path with a dedicated source-policy self-test plus production APK build/JNI-packaging/no-broad-storage checks and a real emulator Compose → DocumentsUI SAF handoff.\n")

          replace('ROADMAP.md',
          "1. **Production Android vault use is no longer blocked on JNI reachability, lifecycle/error-boundary hardening, owner/bridge stress coverage, production module wiring, Compose/navigation, scoped SAF selection, or the first metadata-only read boundary.** Adapter ABI v4 exposes exactly six approved JNI functions: the five lifecycle operations plus one bounded `nativeReadMetadata` channel. The next blocker is wiring real production open/browse state to those summaries without duplicating decrypted vault state in Kotlin.\n2. **Metadata listing is implemented; explicit secret retrieval remains deliberately blocked behind a separate audited tranche.** Phase-1 browsing must first consume the bounded summaries while preserving Rust-only decrypted-state ownership, opaque handles, sanitized errors and explicit lock semantics. Password/TOTP values, notes/custom secret fields and attachment content must not be added opportunistically to the metadata channel.\n",
          "1. **Production Android open/browse is implemented and no longer blocks Phase 1.** Adapter ABI v4 still exposes exactly six approved JNI functions: the five lifecycle operations plus one bounded `nativeReadMetadata` channel. The next blocker is a bounded Rust-backed search/filter query design that returns only identities/summaries needed for the visible result set rather than copying or scanning an independent decrypted model in Kotlin.\n2. **Explicit secret retrieval remains deliberately blocked behind a separate audited tranche.** Production browsing now consumes the bounded summaries while preserving Rust-only decrypted-state ownership, opaque handles, sanitized errors and explicit lock semantics. Password/OTP values, notes/custom secret fields and attachment content must not be added opportunistically to metadata or the upcoming search channel.\n")

          replace('ROADMAP.md',
          "8. [ ] Display real vault groups and entries in the production Compose UI by traversing bounded Rust-backed summaries, without copying the decrypted database model into Kotlin and without adding secret retrieval yet.\n",
          "8. [x] Display real vault groups and entries in the production Compose UI by traversing bounded Rust-backed summaries, without copying the decrypted database model into Kotlin and without adding secret retrieval yet.\n   - [x] Select KDBX/key-file documents through scoped SAF, bound Android ingress, preserve nullable composite credentials, and clear temporary bytes.\n   - [x] Traverse only the current group through Rust-backed summaries and enforce a 1,024-direct-item UI ceiling until paging/query support exists.\n   - [x] Fail closed on background/lifecycle races and retain no vault handle in saved state, intents or bundles.\n   - [x] Prove production APK compilation/JNI packaging/no-broad-storage policy plus Compose → DocumentsUI SAF handoff on the emulator; retain the existing smoke-app Rust metadata/lifecycle proof.\n9. [ ] Design and implement bounded search/filtering through Rust-backed handles/queries, returning only metadata summaries/identities required for the visible result set and adding no secret retrieval yet.\n")

          replace('android/README.md',
          "- `:app` is the production Android application module. It provides the Material 3/Compose shell with top-level Vault/Settings navigation, verifies the native ABI/capability boundary on startup, invokes the existing bounded Rust `lock-all` lifecycle operation when the Activity is backgrounded, and uses Android SAF for scoped KDBX document selection. It can consume the bounded ABI-v4 vault/group/entry metadata summaries through the shared bridge, but production browsing is not yet wired to a user-selected vault. It still exposes no secret retrieval, mutation, persistence, networking, telemetry or Autofill.",
          "- `:app` is the production Android application module. It provides the Material 3/Compose shell with top-level Vault/Settings navigation, verifies the native ABI/capability boundary on startup, invokes the existing bounded Rust `lock-all` lifecycle operation when the Activity is backgrounded, and uses Android SAF for scoped KDBX/key-file selection. A selected vault can now be unlocked with password-only, key-file-only, or password+key-file composite credentials and browsed through bounded ABI-v4 vault/group/entry metadata summaries. It still exposes no explicit secret retrieval, mutation, persistence, networking, telemetry or Autofill.")

          replace('android/README.md',
          "5. launches the smoke application and exercises the same shared `NativeBridge` through Kotlin → JNI → Rust, including Vault → Root → Group → Entry metadata traversal before lifecycle locking.\n",
          "5. proves the real production Compose shell can hand off to Android DocumentsUI through `ACTION_OPEN_DOCUMENT`; and\n6. launches the smoke application and exercises the same shared `NativeBridge` through Kotlin → JNI → Rust, including Vault → Root → Group → Entry metadata traversal before lifecycle locking.\n")

          readme=Path('android/README.md'); text=readme.read_text(encoding='utf-8')
          anchor='\n## Scoped document access\n'
          if anchor not in text: raise SystemExit('missing Scoped document access anchor')
          section='''\n## Production read-only browse path\n\nThe first real production vault session is deliberately narrow:\n\n- Android streams the selected encrypted KDBX through a hard `64 MiB` ingress ceiling and an optional key file through a hard `1 MiB` ceiling. Unknown provider sizes are still bounded while streaming; temporary read buffers are cleared.\n- Password material is collected through an Android `EditText` with view-state saving and Autofill disabled. Fortress copies characters directly to a short-lived UTF-8 byte array without creating a Kotlin password `String`; the editor is cleared on consumption/background/document changes and the byte array is cleared after the native open attempt. `null` means no password component, while a zero-length byte array preserves a deliberately empty password component.\n- `VaultSessionController` is the only production owner of the opaque Rust vault handle. Kotlin keeps no decrypted `Database`/entry tree model; it holds only the current bounded `VaultSummary`, `GroupSummary`, direct child-group summaries and direct entry summaries. A group with more than 1,024 direct items fails closed until a paging/query API exists.\n- Backgrounding increments a session epoch before Rust `lock-all`. In-flight unlock/browse work checks the epoch before publishing state; any handle created after an operation became stale is immediately locked rather than surfaced to Compose. Handles are never written to saved state, intents or bundles.\n- Entries remain metadata-only. Protected title/username/URL values are withheld by the Rust boundary, and password/OTP values, notes/custom secret fields and attachment names/content remain unavailable.\n\n`tools/check_android_vault_browse_policy.py` is part of Foundation CI and locks these source-level invariants against accidental regressions. The next Android read-only tranche is bounded Rust-backed search/filtering; it must not become an alternate secret-retrieval path.\n\n'''
          readme.write_text(text.replace(anchor,section+'## Scoped document access\n',1),encoding='utf-8',newline='\n')

          Path('docs/adr/0004-production-vault-browse-boundary.md').write_text('''# ADR 0004: Production Android vault-browse boundary\n\n- Status: Accepted\n- Date: 2026-08-22\n\n## Context\n\nABI v4 already provides a bounded lifecycle API plus one metadata-only `nativeReadMetadata` channel. Phase 1 now needs a real Android path from a user-selected SAF document to visible groups and entries without creating a second decrypted vault model in Kotlin or widening metadata into secret retrieval.\n\nThe Android layer also has lifecycle races that do not exist in host tests: a slow provider read/KDF can finish after backgrounding, Activity state can be recreated, and composite credentials must distinguish an absent password component from a deliberately empty password.\n\n## Decision\n\n1. `VaultSessionController` is the only production Android owner of the opaque live Rust handle. The handle is process-memory state only and is never persisted in saved state, intents, bundles or URIs.\n2. Android reads selected encrypted inputs through bounded streaming before JNI: `64 MiB` maximum KDBX input and `1 MiB` maximum key-file input. Provider-reported sizes are advisory; the streaming loop enforces the ceiling again.\n3. Password input stays byte-oriented. Android view-state persistence and Autofill are disabled for the master-password editor. `null` represents an absent password component; `ByteArray(0)` represents a deliberately empty password component. Temporary password, key-file and encrypted-vault byte arrays are cleared after the open attempt.\n4. Kotlin does not own or reconstruct a decrypted database tree. It keeps only the current `VaultSummary`, current `GroupSummary`, the direct child-group summaries and direct entry summaries obtained through ABI v4.\n5. A production group is limited to 1,024 direct child groups plus entries until a dedicated paging/query API exists. Exceeding the UI ceiling fails closed instead of materializing an arbitrarily large Kotlin result set.\n6. Each asynchronous unlock/browse operation carries a monotonically increasing lifecycle epoch. Backgrounding/explicit lock invalidates the epoch and calls Rust `lock-all`; stale work cannot publish state, and a handle produced after staleness is immediately locked.\n7. The browse tranche remains metadata-only. Protected title/username/URL values remain withheld by the Rust boundary. Password/OTP values, notes/custom secret fields and attachment names/content are not added.\n8. Foundation CI includes a source-policy self-test for bounded SAF ingress, byte-oriented credential handling, transient-buffer clearing, the single production `openVault` callsite, lifecycle epoch/lock-all behavior and the 1,024-item browser ceiling. Android CI additionally builds the production APK, checks JNI packaging/permissions and proves the Compose → DocumentsUI SAF handoff on an emulator.\n\n## Consequences\n\n- The production app can now open and browse supported KDBX vaults while Rust remains the sole owner of the decrypted database model.\n- Large groups above the current direct-item ceiling are intentionally not browsable until paging/query support is designed. This is preferable to an unbounded Kotlin materialization path.\n- Search/filtering must be implemented as a bounded Rust-backed query over the live handle. It may return metadata identities/summaries needed for the visible result set, but it must not introduce secret values.\n- Explicit secret reveal/copy remains a separate audited Phase-1 tranche with its own API, memory, clipboard and lifecycle policy.\n''',encoding='utf-8',newline='\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md android/README.md docs/adr/0004-production-vault-browse-boundary.md
          git commit -m 'docs: complete production browse roadmap tranche'
          git push origin HEAD:feat/compose-vault-browser